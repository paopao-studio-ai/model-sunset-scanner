# Generated from the official deprecation pages listed in meta.sources. Edit by hand only with a source link.
meta:
  description: 'Retirement rules for OpenAI and Anthropic API models/endpoints. Only entries with status: verified are reported by default.'
  verified_on: '2026-10-31'
  sources:
    openai: https://developers.openai.com/api/docs/deprecations
    anthropic: https://platform.claude.com/docs/en/about-claude/model-deprecations (docs.anthropic.com redirects here)
  status_legend:
    verified: model ID and shutdown date both appear verbatim on the official deprecations page (checked on verified_on)
    unverified: alias/family inference, NOT verified on an official page; reported only with --include-unverified
  out_of_scope: Azure OpenAI, AWS Bedrock, Vertex AI and OpenRouter publish their own retirement schedules for same-named models; those are NOT
    covered or verified here.
entries:
- provider: openai
  models:
  - gpt-4o-2024-08-06
  - gpt-4o-2024-11-20
  shutdown_date: '2027-01-14'
  replacement: gpt-6-luna
  kind: snapshot
  status: verified
  batch: '2026-10-14: GPT-4 series model deprecations'
  params_to_change:
  - param: reasoning_effort / reasoning.effort
    change: gpt-6-luna defaults to medium; set none explicitly if you need gpt-4.x-like non-reasoning behaviour.
    quote: reasoning.effort supports none, low, medium (default), high, xhigh, and max.
    source: https://developers.openai.com/api/docs/models/gpt-6-luna
  - param: temperature, top_p, top_logprobs (+ logprobs on Chat Completions)
    change: Must be removed when reasoning effort is not none (not required by the docs when effort = none).
    quote: When reasoning effort is not none, remove temperature, top_p, and top_logprobs. For Chat Completions, also remove logprobs.
    source: https://developers.openai.com/api/docs/guides/latest-model
  - param: tools / function calling
    change: On Chat Completions, function calling requires reasoning_effort=none; otherwise move to the Responses API (affects tool calling in
      n8n AI Agent).
    quote: Chat Completions supports function calling only with reasoning_effort set to none.
    source: https://developers.openai.com/api/docs/models/gpt-6-luna
  - param: max_tokens
    change: Use max_completion_tokens on Chat Completions (max_output_tokens on Responses).
    quote: This value is now deprecated in favor of max_completion_tokens
    source: https://developers.openai.com/api/reference/resources/chat/subresources/completions/methods/create
  source_url: https://developers.openai.com/api/docs/deprecations
  note: null
  verified_on: '2026-10-31'
